# ==============================================================================
# LogiSense CI Pipeline
# ==============================================================================
# Triggered on push to any branch and PRs to main
# Runs linting, security scanning, and unit tests in parallel
# ==============================================================================

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # Python Linting
  # ============================================================================
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: |
          mypy modules/ platform/ \
            --ignore-missing-imports \
            --no-error-summary \
            --exclude 'alembic/' \
            --exclude 'tests/' \
            || true  # Don't fail on type errors for now

  # ============================================================================
  # Frontend Linting
  # ============================================================================
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for frontend files
        id: check-frontend
        run: |
          if find modules -path "*/ui/src/*.ts" -o -path "*/ui/src/*.tsx" 2>/dev/null | grep -q .; then
            echo "has_frontend=true" >> $GITHUB_OUTPUT
          else
            echo "has_frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Install prettier
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: npm install -g prettier eslint

      - name: Run prettier check
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: prettier --check "modules/**/ui/src/**/*.{ts,tsx}" || true

      - name: Run eslint
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: |
          for dir in modules/*/ui; do
            if [ -d "$dir/src" ]; then
              echo "Linting $dir..."
              cd "$dir" && npm install && npm run lint || true
              cd -
            fi
          done

      - name: Skip frontend linting
        if: steps.check-frontend.outputs.has_frontend == 'false'
        run: echo "No frontend files found, skipping lint"

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Run Trivy filesystem scan
        run: |
          trivy fs . \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --skip-dirs node_modules \
            --skip-dirs .venv \
            --skip-dirs __pycache__ \
            || echo "::warning::Trivy found vulnerabilities"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit -r modules/ platform/ \
            -ll \
            --exclude '**/tests/**,**/.venv/**' \
            -f json -o bandit-report.json \
            || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test-unit:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - iwms
          - lip
          - ccvp
          - pise
          - wcvp
          - uoih
          - license-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Determine test path
        id: test-path
        run: |
          if [ "${{ matrix.module }}" = "license-service" ]; then
            TEST_PATH="platform/license-service/tests"
            MODULE_PATH="platform/license-service"
          else
            TEST_PATH="modules/${{ matrix.module }}/tests"
            MODULE_PATH="modules/${{ matrix.module }}"
          fi
          echo "test_path=$TEST_PATH" >> $GITHUB_OUTPUT
          echo "module_path=$MODULE_PATH" >> $GITHUB_OUTPUT

      - name: Check for tests
        id: check-tests
        run: |
          if [ -d "${{ steps.test-path.outputs.test_path }}" ] && \
             find "${{ steps.test-path.outputs.test_path }}" -name "test_*.py" | grep -q .; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          if [ -f "${{ steps.test-path.outputs.module_path }}/pyproject.toml" ]; then
            pip install -e "${{ steps.test-path.outputs.module_path }}[dev]" || \
            pip install -e "${{ steps.test-path.outputs.module_path }}"
          elif [ -f "${{ steps.test-path.outputs.module_path }}/requirements.txt" ]; then
            pip install -r "${{ steps.test-path.outputs.module_path }}/requirements.txt"
          fi

      - name: Run tests
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          pytest ${{ steps.test-path.outputs.test_path }} \
            -v \
            --cov=${{ steps.test-path.outputs.module_path }} \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            || echo "::warning::Coverage below 80%"

      - name: Upload coverage report
        if: steps.check-tests.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: coverage.xml
          retention-days: 7

      - name: Skip tests
        if: steps.check-tests.outputs.has_tests == 'false'
        run: echo "No tests found for ${{ matrix.module }}, skipping"

  # ============================================================================
  # Helm Chart Linting
  # ============================================================================
  helm-lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Check for Helm charts
        id: check-helm
        run: |
          if [ -d "infra/helm" ] && find infra/helm -name "Chart.yaml" | grep -q .; then
            echo "has_charts=true" >> $GITHUB_OUTPUT
          else
            echo "has_charts=false" >> $GITHUB_OUTPUT
          fi

      - name: Lint module charts
        if: steps.check-helm.outputs.has_charts == 'true'
        run: |
          for chart in infra/helm/modules/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart..."
              helm lint "$chart" || true
            fi
          done

      - name: Lint platform charts
        if: steps.check-helm.outputs.has_charts == 'true'
        run: |
          for chart in infra/helm/platform/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart..."
              helm lint "$chart" || true
            fi
          done

      - name: Skip Helm linting
        if: steps.check-helm.outputs.has_charts == 'false'
        run: echo "No Helm charts found, skipping lint"

  # ============================================================================
  # CI Summary
  # ============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-python, lint-frontend, security-scan, test-unit, helm-lint]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Lint | ${{ needs.lint-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.lint-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm Lint | ${{ needs.helm-lint.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
