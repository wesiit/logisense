# ==============================================================================
# LogiSense Dependency Review
# ==============================================================================
# Scans PRs for vulnerable dependencies
# Fails on high/critical severity vulnerabilities
# ==============================================================================

name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always
          allow-ghsas: ""
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate summary
        if: always()
        run: |
          echo "## 🔍 Dependency Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scanned dependencies for vulnerabilities and license compliance." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Fail on: HIGH, CRITICAL severity" >> $GITHUB_STEP_SUMMARY
          echo "- Denied licenses: GPL-3.0, AGPL-3.0" >> $GITHUB_STEP_SUMMARY
