x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # ===========================================================================
  # PostgreSQL 16
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: logisense-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logisense}
      POSTGRES_USER: ${POSTGRES_USER:-logisense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logisense_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-logisense} -d ${POSTGRES_DB:-logisense}",
        ]
    networks:
      - logisense-net

  # ===========================================================================
  # Redis 7.2
  # ===========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: logisense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - logisense-net

  # ===========================================================================
  # MinIO (S3-compatible object storage)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: logisense-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mc", "ready", "local"]
    networks:
      - logisense-net

  minio-init:
    image: minio/mc:latest
    container_name: logisense-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing myminio/logisense-bronze;
      mc mb --ignore-existing myminio/logisense-silver;
      mc mb --ignore-existing myminio/logisense-gold;
      mc mb --ignore-existing myminio/logisense-mlflow;
      echo 'MinIO buckets created successfully';
      exit 0;
      "
    networks:
      - logisense-net

  # ===========================================================================
  # Kafka (Confluent Platform)
  # ===========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logisense-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "LogiSenseDevCluster001"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1",
        ]
      start_period: 60s
    networks:
      - logisense-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logisense-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Kafka to be ready...';
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic logisense.iwms.inventory.movement --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic logisense.iwms.wave.released --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic logisense.ccvp.sensor.reading --partitions 6 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic logisense.ccvp.lot.excursion --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic logisense.wcvp.zone.occupancy --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic logisense.wcvp.dock.truck_arrival --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic logisense.lip.schedule.published --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic logisense.pise.slotting.recommendation --partitions 3 --replication-factor 1;
      echo 'Kafka topics created successfully';
      exit 0;
      "
    networks:
      - logisense-net

  # ===========================================================================
  # Keycloak (Identity Provider)
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: logisense-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./platform/identity/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: start-dev --import-realm
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;",
        ]
      start_period: 60s
    networks:
      - logisense-net

  # ===========================================================================
  # Kong API Gateway (Declarative Mode)
  # ===========================================================================
  kong:
    image: kong:3.6-ubuntu
    container_name: logisense-kong
    ports:
      - "8000:8000" # Proxy
      - "8443:8443" # Proxy SSL
      - "8001:8001" # Admin API
      - "8444:8444" # Admin API SSL
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    volumes:
      - ./platform/api-gateway/kong.dev.yml:/etc/kong/kong.yml:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "kong", "health"]
    networks:
      - logisense-net

  # ===========================================================================
  # HashiCorp Vault (Secrets Management)
  # ===========================================================================
  vault:
    image: hashicorp/vault:1.16
    container_name: logisense-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "vault", "status"]
    networks:
      - logisense-net

  # ===========================================================================
  # MailHog (Email Testing)
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: logisense-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
    networks:
      - logisense-net

networks:
  logisense-net:
    name: logisense-network
    driver: bridge

volumes:
  postgres_data:
    name: logisense-postgres-data
  redis_data:
    name: logisense-redis-data
  minio_data:
    name: logisense-minio-data
  kafka_data:
    name: logisense-kafka-data
