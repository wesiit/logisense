# ==============================================================================
# LogiSense iWMS - Alembic Configuration
# ==============================================================================

[alembic]
script_location = db/migrations
prepend_sys_path = .

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Truncate long revision strings
truncate_slug_length = 40

# Set to 'true' to run migrations offline
# offline = false

# Use async engine
# sqlalchemy.url is set via env.py from DATABASE_URL environment variable

[post_write_hooks]
# Format with ruff after generation
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
