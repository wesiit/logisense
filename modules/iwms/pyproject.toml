[project]
name = "logisense-iwms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111", "uvicorn[standard]", "sqlalchemy[asyncio]>=2.0",
  "asyncpg", "pydantic-settings>=2.0", "aiokafka", "structlog",
  "prometheus-fastapi-instrumentator", "python-jose[cryptography]",
  "httpx", "alembic", "python-json-logger"
]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "pytest-cov"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "db*"]
