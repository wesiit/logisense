# ==============================================================================
# Global Plugins
# ==============================================================================
plugins:
  # ---------------------------------------------------------------------------
  # Correlation ID - Generate X-Request-ID for request tracing
  # ---------------------------------------------------------------------------
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # ---------------------------------------------------------------------------
  # Request Size Limiting - Max 10MB payload
  # ---------------------------------------------------------------------------
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false

  # ---------------------------------------------------------------------------
  # CORS - Cross-Origin Resource Sharing
  # ---------------------------------------------------------------------------
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
        - https://*.logisense.io
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-Type
        - Content-MD5
        - Date
        - X-Auth-Token
        - X-Request-ID
        - X-Tenant-ID
        - X-Facility-ID
      exposed_headers:
        - X-Request-ID
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
      credentials: true
      max_age: 3600
      preflight_continue: false
