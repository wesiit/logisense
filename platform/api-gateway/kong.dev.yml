_format_version: "3.0"
_transform: true

# ==============================================================================
# LogiSense Kong API Gateway - Development Configuration
# Kong OSS 3.6 DB-less Mode (deck format)
# ==============================================================================
# JWT validation is enabled on all module routes.
# For development, using HS256 with a shared secret.
# For production, configure RS256 with Keycloak's public key.
# ==============================================================================

# ==============================================================================
# Consumers (for JWT validation)
# ==============================================================================
consumers:
  - username: logisense-service
    custom_id: logisense-jwt-consumer
    jwt_secrets:
      - key: logisense-issuer
        algorithm: HS256
        secret: logisense-dev-jwt-secret-change-in-production

# ==============================================================================
# Services and Routes
# ==============================================================================
services:
  # ---------------------------------------------------------------------------
  # Module APIs (JWT Protected)
  # ---------------------------------------------------------------------------
  - name: iwms-service
    url: http://iwms-api:8001
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    routes:
      - name: iwms-route
        paths:
          - /v1/iwms
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp

  - name: lip-service
    url: http://lip-api:8002
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
