_format_version: "3.0"
_transform: true

# ==============================================================================
# LogiSense Kong API Gateway - Development Configuration
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Module APIs
  # ---------------------------------------------------------------------------
  - name: iwms-api
    url: http://host.docker.internal:3001
    routes:
      - name: iwms-route
        paths:
          - /api/v1/iwms
        strip_path: false

  - name: lip-api
    url: http://host.docker.internal:3002
    routes:
      - name: lip-route
        paths:
          - /api/v1/lip
        strip_path: false

  - name: ccvp-api
    url: http://host.docker.internal:3003
    routes:
      - name: ccvp-route
        paths:
          - /api/v1/ccvp
        strip_path: false

  - name: pise-api
    url: http://host.docker.internal:3004
    routes:
      - name: pise-route
        paths:
          - /api/v1/pise
        strip_path: false

  - name: wcvp-api
    url: http://host.docker.internal:3005
    routes:
      - name: wcvp-route
        paths:
          - /api/v1/wcvp
        strip_path: false

  - name: uoih-api
    url: http://host.docker.internal:3006
    routes:
      - name: uoih-route
        paths:
          - /api/v1/uoih
        strip_path: false

  # ---------------------------------------------------------------------------
  # Platform Services
  # ---------------------------------------------------------------------------
  - name: identity-api
    url: http://keycloak:8080
    routes:
      - name: identity-route
        paths:
          - /auth
        strip_path: false

  - name: license-api
    url: http://host.docker.internal:3010
    routes:
      - name: license-route
        paths:
          - /api/v1/license
        strip_path: false

# ==============================================================================
# Plugins (Global)
# ==============================================================================
plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
        - X-Tenant-ID
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 3600

  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  - name: rate-limiting
    config:
      minute: 1000
      policy: local
