# ==============================================================================
# Grafana Dashboard Provisioning
# ==============================================================================

apiVersion: 1

providers:
  - name: LogiSense Dashboards
    orgId: 1
    folder: LogiSense
    folderUid: logisense
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
