# ==============================================================================
# LogiSense Prometheus Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: logisense-dev
    env: development

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # --------------------------------------------------------------------------
  # Prometheus self-monitoring
  # --------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # --------------------------------------------------------------------------
  # Kong API Gateway metrics
  # --------------------------------------------------------------------------
  - job_name: kong
    static_configs:
      - targets:
          - kong:8001
    metrics_path: /metrics

  # --------------------------------------------------------------------------
  # LogiSense Module Services
  # --------------------------------------------------------------------------
  - job_name: iwms-api
    static_configs:
      - targets:
          - iwms-api:8011
    metrics_path: /metrics

  - job_name: lip-api
    static_configs:
      - targets:
          - lip-api:8002
    metrics_path: /metrics

  - job_name: ccvp-api
    static_configs:
      - targets:
          - ccvp-api:8003
    metrics_path: /metrics

  - job_name: pise-api
    static_configs:
      - targets:
          - pise-api:8004
    metrics_path: /metrics

  - job_name: wcvp-api
    static_configs:
      - targets:
          - wcvp-api:8005
    metrics_path: /metrics

  - job_name: uoih-api
    static_configs:
      - targets:
          - uoih-api:8006
    metrics_path: /metrics

  # --------------------------------------------------------------------------
  # Platform Services
  # --------------------------------------------------------------------------
  - job_name: license-api
    static_configs:
      - targets:
          - license-api:8007
    metrics_path: /metrics

  # --------------------------------------------------------------------------
  # Infrastructure Exporters
  # --------------------------------------------------------------------------
  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
