# ==============================================================================
# LogiSense Alerting Rules
# ==============================================================================

groups:
  # ============================================================================
  # Service Availability
  # ============================================================================
  - name: service_availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~".*-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "The service {{ $labels.job }} ({{ $labels.instance }}) has been down for more than 1 minute."

      - alert: ServiceHighRestartRate
        expr: increase(process_start_time_seconds{job=~".*-api"}[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.job }} restarting frequently"
          description: "The service {{ $labels.job }} has restarted more than 3 times in the last hour."

  # ============================================================================
  # API Performance
  # ============================================================================
  - name: api_performance
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "The service {{ $labels.job }} has an HTTP 5xx error rate above 1% over the last 5 minutes. Current rate: {{ $value | humanizePercentage }}"

      - alert: SlowAPIResponse
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow API response on {{ $labels.job }}"
          description: "The p95 latency for {{ $labels.job }} is above 1 second over the last 5 minutes. Current p95: {{ $value | humanizeDuration }}"

      - alert: HighRequestLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)
          ) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Very slow API response on {{ $labels.job }}"
          description: "The p99 latency for {{ $labels.job }} is above 3 seconds. Current p99: {{ $value | humanizeDuration }}"

  # ============================================================================
  # Kafka
  # ============================================================================
  - name: kafka_alerts
    interval: 30s
    rules:
      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka consumer lag for {{ $labels.consumergroup }}"
          description: "Consumer group {{ $labels.consumergroup }} has a lag of {{ $value }} messages on topic {{ $labels.topic }}."

      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"
          description: "No Kafka brokers are available. This will cause message processing to fail."

      - alert: KafkaTopicUnderReplicated
        expr: kafka_topic_partition_under_replicated_partition > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka topic under-replicated"
          description: "Topic {{ $labels.topic }} has {{ $value }} under-replicated partitions."

  # ============================================================================
  # Database
  # ============================================================================
  - name: database_alerts
    interval: 30s
    rules:
      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of PostgreSQL connections"
          description: "PostgreSQL has {{ $value }} active connections, approaching the default limit of 100."

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag"
          description: "PostgreSQL replication lag is {{ $value }} seconds."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "{{ $value }} deadlocks detected in PostgreSQL in the last 5 minutes."

  # ============================================================================
  # Redis
  # ============================================================================
  - name: redis_alerts
    interval: 30s
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis instance is not responding."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{ $value | humanizePercentage }} of available memory."
